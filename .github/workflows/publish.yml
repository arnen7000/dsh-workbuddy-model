name: publish

# 在 GitHub 上「发布 Release」即自动发布到 npm。
#
# 用 OIDC 可信发布（Trusted Publishing）：不依赖任何长期有效的 npm token，
# 发布物自动附带 provenance 签名。前提是在 npmjs.com 的包设置里把本仓库
# 登记为 Trusted Publisher。
on:
  release:
    types: [published]
  workflow_dispatch:

# 最小权限：仓库内容只读 + 允许签发 OIDC 身份令牌。
# `id-token: write` 是可信发布的硬要求，缺了会以 ENEEDAUTH 失败。
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 升级 npm（可信发布要求 >= 11.5.1）
        run: npm install -g npm@latest && npm --version

      # 版本一致性闸门：Release tag 必须等于 package.json 的 version。
      # 插件版本号在三个地方（package.json + 两个 bundle），契约套件已保证一致；
      # 这里再保证 tag 与它们一致，避免「tag 写 0.2.0、实际发出去 0.1.0」。
      - name: 版本一致性闸门
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          PKG="$(node -p "require('./package.json').version")"
          TAG="${RELEASE_TAG#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json 的版本是 $PKG，Release tag 是 $TAG，两者不一致，拒绝发布。"
            exit 1
          fi
          echo "版本一致：$PKG"

      # 发布前跑两层套件，任一失败即不发布。
      - name: 发布前跑契约与场景套件
        run: |
          node tools/run-tests.mjs
          node tools/scenarios.mjs "$PWD"

      # 可信发布不使用任何 token。显式确认环境里没有「真实」凭据，
      # 免得日后有人加回 NODE_AUTH_TOKEN，变成「看起来在用 OIDC、其实在用长期 token」。
      #
      # ⚠️ 必须放过 actions/setup-node 的占位值：给了 registry-url 之后，它会主动把
      # NODE_AUTH_TOKEN 设成字面量 XXXXX-XXXXX-XXXXX-XXXXX，目的是让缺 token 的
      # `npm install` 不报错。那是无害占位值，不是凭据。
      - name: 确认未注入长期 token 且 OIDC 通道可用
        run: |
          set -eu
          PLACEHOLDER='XXXXX-XXXXX-XXXXX-XXXXX'
          if [ -n "${NODE_AUTH_TOKEN:-}" ] && [ "${NODE_AUTH_TOKEN}" != "$PLACEHOLDER" ]; then
            echo "::error::检测到真实的 NODE_AUTH_TOKEN —— 可信发布应走 OIDC，不应注入长期 token。"
            exit 1
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN 不应存在（可信发布用 OIDC）。"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::缺少 ACTIONS_ID_TOKEN_REQUEST_URL —— id-token: write 未生效，无法走 OIDC。"
            exit 1
          fi
          echo "未发现长期 token（setup-node 的占位值已忽略），OIDC 通道可用。"

      - name: 发布到 npm（OIDC，自动生成 provenance）
        run: npm publish
